packages:
  - "packages/*"

# ─── Dependency install-script approvals ───────────────────────────────────────
# pnpm blocks dependency lifecycle scripts by default (a package's `postinstall` is arbitrary code
# running with your shell's privileges — the standard supply-chain foothold), and since pnpm 11 an
# unapproved build is a hard `ERR_PNPM_IGNORED_BUILDS` error. Each script below is approved
# deliberately.
#
# The first four are native modules whose install scripts are only a FALLBACK: each ships prebuilt
# platform binaries as optional deps (`@esbuild/darwin-arm64`, `@lmdb/lmdb-darwin-arm64`, and so on),
# and the script compiles from source only when no prebuilt matches. They're approved because the
# fallback should be available on a machine or CI arch where the prebuilt doesn't resolve.
allowBuilds:
  # Native FS watching for dev servers; without it, watch mode degrades to polling.
  '@parcel/watcher': true
  # Links/validates the platform binary. Every dev server and build in the repo goes through esbuild.
  esbuild: true
  # @angular/build's optional persistent disk cache, used by `examples-angular`. Angular
  # degrades gracefully without it, at the cost of slower incremental rebuilds.
  lmdb: true
  # lmdb's companion native (de)serializer; same optional-accelerator story.
  msgpackr-extract: true
  # msw's postinstall copies `mockServiceWorker.js` into the directories named by a package's
  # `msw.workerDirectory` field (examples-react-rtk + examples-react-plain declare `public`). The wine
  # route uses browser-mode MSW (`setupWorker(...).start()` in each app's `src/mocks/browser.ts`, to
  # serve the default-tier streaming endpoint in dev), so the worker script is load-bearing, not dead
  # weight. Approving keeps that committed `public/mockServiceWorker.js` in sync with the installed msw
  # version on every install.
  msw: true
  # Cloudflare's Workers runtime, pulled in by `wrangler` (the deploy CLI, and a peer of
  # `@sveltejs/adapter-cloudflare`). Same fallback-only story as esbuild: the binary arrives as a
  # platform optional dep (`@cloudflare/workerd-darwin-arm64`, …) and the postinstall only validates it.
  # `wrangler deploy` never runs it; `wrangler dev` does.
  workerd: true

# ─── Supply-chain policy: the 7-day release-age quarantine ─────────────────────
# 🟢 **pnpm 12 REPORTS an unrecognized setting in this file instead of ignoring it.** A misspelled
# `minimumReleaseAge` or `minimumReleaseAgeExclude` would otherwise drop the policy silently — a
# supply-chain guard that evaporates with no output. The build-script settings pnpm 12 removed
# (`onlyBuiltDependencies`, `neverBuiltDependencies`, `ignoredBuiltDependencies`, and the rest) are
# expressed by the `allowBuilds` map above.
#
# ⚠ This file is in `.prettierignore`. Prettier rewrites single-quoted YAML scalars to double quotes,
# so an unrelated comment edit would arrive as a whole-file diff in the file that carries the
# supply-chain policy. The quoting below is deliberate; leave it alone.
#
# `minimumReleaseAge` is 10080 minutes — 7 days. pnpm refuses any version published less than 7 days
# ago, so a compromised release has a week to be noticed and pulled before it can reach this tree.
# The check runs twice — once during resolution (`pnpm add`, `pnpm update`), and again as a
# verification pass over every entry of an already-written lockfile, `--frozen-lockfile` installs
# included. The engine tarballs the `overrides` below point at are local files, so the quarantine
# never applies to them.
#
# 🟢 The value is written out rather than left to pnpm's built-in 1440 (24h) default, and that also
# changes how a violation behaves: an explicitly set `minimumReleaseAge` makes `minimumReleaseAgeStrict`
# default to `true`, so a too-young version FAILS the install (`ERR_PNPM_NO_MATURE_MATCHING_VERSION`
# when resolving, `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION` when verifying the lockfile) instead of being
# added to `minimumReleaseAgeExclude` without anyone deciding to.
#
# `.github/dependabot.yml` gives GitHub Actions the same 7 days (`cooldown.default-days: 7`), and
# `tests/tooling/releaseAgeCooldown.test.ts` keeps every cooldown there at least as long as this
# quarantine, so raising this value means raising the cooldown in the same change.
#
# ── Exemptions: `minimumReleaseAgeExclude` ──
#
# Nothing in this lockfile needs one, so there is no list. When a security fix is younger than 7 days,
# exempt that ONE version:
#
#   minimumReleaseAgeExclude:
#     # GHSA-xxxx-xxxx-xxxx: fixed in 1.2.3
#     - 'some-package@1.2.3'
#
# pnpm 12 accepts an exact version or a union of exact versions (`'some-package@1.2.3 || 1.2.4'`) and
# rejects a range (`some-package@^1.2.3` fails with `ERR_PNPM_INVALID_MINIMUM_RELEASE_AGE_EXCLUDE`). A
# bare package name exempts every version, the next release included, so it is never the fix, and
# the same test rejects one. Delete the entry once the lockfile has moved past that version or the
# version is older than 7 days. SECURITY.md → "Dependency release age" has the whole procedure.
minimumReleaseAge: 10080

# ─── Security remediation — force patched transitive versions ─────────────────────────────────────
# Every advisory these address is in DEV TOOLING or the unpublished demo apps. These pin the patched
# floor for the transitive-only ones; the app-facing direct deps are bumped in their own package.json
# instead.
#
# What each pin is for: esbuild/postcss (dev-server file-read + source-map traversal), fast-uri
# (Angular CLI chain), cookie (SvelteKit + msw; see below), linkify-it / markdown-it (markdownlint),
# smol-toml (markdownlint; see below), brace-expansion's v5 line (the vulnerable copy is 5.0.6,
# `<=5.0.7`; scoped by major so that a v1 or v2 copy keeps its own chain intact), and
# postcss-selector-parser's v6 line (see below).
#
# **react-router is NOT overridden.** Its RSC-mode CSRF advisory is patched only in 8.3.0, a MAJOR
# bump, so the React apps depend on `react-router@^8.3.0` directly. No transitive pin is needed; the
# direct dep IS the fix.
#
# **react / react-dom are pinned to ONE workspace-wide copy.** react-router 8 needs react >=19.2.7,
# while packages such as react-ui, brand and the engine's React bindings declare the honest wider
# `^19.0.0` peer — so without these overrides pnpm can keep a second React copy alongside the newer
# one, and a component rendered by one react-dom whose hooks resolve the other react gets `null` from
# `useContext`/`useId` (every React component test and app crashes at mount). These overrides dedupe
# every react/react-dom in the install to a single 19.x copy WITHOUT lying about the bindings' real peer
# range. `^19.2.7` == `>=19.2.7 <20`, so it satisfies react-router 8 and stays capped below the next
# major (per the cap rule below).
#
# **Every replacement carries an UPPER major bound.** A pnpm override replacement is a range, and pnpm
# resolves it to the HIGHEST available match — so an open-ended `>=x` silently floats to a new major.
# Widen a cap only alongside the matching direct-dep major bump.
#
# 🟢 `tests/tooling/overrideUpperBounds.test.ts` enforces that rule, and also rejects a pin that matches
# nothing in the lockfile: **a pin that matches nothing is worse than useless.** It is a standing claim
# that a risk was weighed, and it keeps looking true long after the risk is gone. If such a package
# returns through some other chain, its advisory returns with it through `pnpm audit`, which is the
# instrument that is supposed to notice.
#
# 🟢 Each cap is set to the NEXT major above what is installed, and each floor to the resolved version,
# so bounding them is lockfile-neutral BY CONSTRUCTION: the tree already satisfies every one. The
# original advisory floors are recorded here rather than in the ranges, because a floor that no longer
# matches the installed version only reads as precision —
# `esbuild >=0.28.1`, `postcss >=8.5.18`, `linkify-it >=5.0.2`. Three floors ARE advisory fixes:
# `fast-uri >=4.2.3` (four URI-parsing advisories, GHSA-w74x-v6f9-j3xg among them), `markdown-it >=15.0.3`
# (GHSA-gfr2-rv44-r23c, GHSA-vfgh-jcmw-g37q) and `postcss-selector-parser >=6.1.5` (see below).
# ⚠ `esbuild`'s cap is `<0.29.0`, not `<1.0.0`: in 0.x the MINOR is the
# breaking boundary, so a `<1` cap on a 0.x package is not a cap at all.
#
# ── 🔴 `cookie` — why the cap is `<2.0.0` ────────────────────────────────────────────────────────────
#
# The pin exists for CVE-2024-47764 (out-of-bounds characters in cookie name / path / domain), patched
# in 0.7.0. Unbounded, it floats to **2.x**, and cookie 2.x RENAMED THE ENTIRE API:
#
#   parse -> parseCookie        serialize -> stringifySetCookie
#
# `@sveltejs/kit@2.70.3` declares `cookie: ^0.6.0` and imports `{ parse, serialize }`. Against 2.x
# those exports do not exist, so SvelteKit's SSR runtime fails to evaluate — `The requested module
# 'cookie' does not provide an export named 'serialize'` — and every Playwright project behind the
# SvelteKit dev server is dead before the first test runs.
#
# 🔴 AND NO TYPE CHECK CAN CATCH IT. Kit ships `@types/cookie@0.6.0` as its own dependency, so
# TypeScript resolves `serialize` from the 0.6 type stubs while Node resolves a module that does not
# export it. cookie 2.x even keeps a TYPE called `SerializeOptions` "for backward compatibility" while
# having dropped the function — the type survives the rename and the value does not, which is the worst
# possible combination for catching this early.
#
# 🟢 THE CAP IS FORCED RATHER THAN CHOSEN. Two packages consume `cookie` here with incompatible declared
# ranges:
#
#   @sveltejs/kit@2.70.3  cookie: ^0.6.0   needs `parse` / `serialize`
#   msw@2.15.0            cookie: ^1.1.1   needs `parseCookie` / `stringifySetCookie`
#
# `cookie@1.1.1` is the only line that satisfies BOTH, because 1.x ships the new names AND keeps the
# old ones as aliases — `export { stringifySetCookie as serialize, parseCookie as parse }`, with a
# `(name, val, options)` overload matching how kit calls it. 2.x dropped the aliases; `<1.0.0` would
# resolve 0.7.x and break msw instead. So one cap serves both consumers and dedupes `cookie` to one
# installed copy.
#
# ── `smol-toml` ──────────────────────────────────────────────────────────────────────────────────────
#
# For GHSA-r4xh-jqrq-34v2 (quadratic `parse()`). `markdownlint-cli2` pins `smol-toml: "1.8.0"` EXACTLY,
# so there is no upstream bump to reach for — an override is the only remediation that changes the
# installed tree. It is within-minor (1.8.0 -> 1.9.0), and `smol-toml@1.9.0` is also installed via
# `cspell-config-lib`, so the pin DEDUPES two copies to one rather than introducing anything.
#
# ⚠ Chosen over accepting the advisory even though the vulnerable code is unreachable — this repo has
# **no TOML file at all**, so `markdownlint-cli2` never calls `smol-toml.parse()`. That reachability
# argument is the fragile one: it holds only until someone adds a `.markdownlint.toml`, and it would hold
# silently wrong from that moment. Removing the vulnerable code from the tree does not depend on nobody
# doing that.
#
# ⚠ The override is doing real work, and because pnpm audit reads resolved versions it needs no
# `ignoreGhsas` entry. Deleting it restores markdownlint-cli2's exact `1.8.0` pin and the advisory comes
# straight back; retire it only when markdownlint-cli2 moves past 1.8.0 upstream.
#
# ── `postcss-selector-parser` ────────────────────────────────────────────────────────────────────────
#
# For GHSA-rj75-hqrm-r3gf (quadratic flat-selector parsing). `@tailwindcss/typography`, whose latest
# release is installed, pins `postcss-selector-parser: "6.0.10"` EXACTLY, so no upstream bump reaches a
# fix. The advisory is patched on the 6.x line too, in 6.1.5, so the override stays inside the major the
# plugin was written for; it is scoped to `^6.0.0` so the 7.x copy that eslint-plugin-vue and
# svelte-eslint-parser use keeps its own chain. Retire it when the plugin moves past 6.0.10 upstream.

# ─── Peer ranges pnpm cannot reconcile on its own ─────────────────────────────────────────────────────
# `oxc-parser` (under `@angular/build` and `@schematics/angular`) lists a WebAssembly fallback,
# `@oxc-parser/binding-wasm32-wasi`, which installs only on a platform with no native binding (never on
# macOS or the Linux CI runners). It pins `@emnapi/core` and `@emnapi/runtime` to `2.0.0-alpha.3` beside a
# `@napi-rs/wasm-runtime` whose peer range names `^1.7.1 || 2.0.0-beta.2`, so `pnpm peers check` reports the
# pairing oxc publishes as unmet. These rules accept that pairing; nothing installed here changes.
peerDependencyRules:
  allowedVersions:
    '@napi-rs/wasm-runtime>@emnapi/core': '2.0.0-alpha.3'
    '@napi-rs/wasm-runtime>@emnapi/runtime': '2.0.0-alpha.3'

overrides:
  react: '^19.2.7'
  react-dom: '^19.2.7'
  esbuild: '>=0.28.2 <0.29.0'
  postcss: '>=8.5.29 <9.0.0'
  fast-uri: '>=4.2.3 <5.0.0'
  cookie: '>=0.7.0 <2.0.0'
  linkify-it: '>=6.1.0 <7.0.0'
  markdown-it: '>=15.0.3 <16.0.0'
  smol-toml: '>=1.9.0 <2.0.0'
  'brace-expansion@^5.0.0': '>=5.0.8 <6.0.0'
  'postcss-selector-parser@^6.0.0': '>=6.1.5 <7.0.0'
  # ─── The engine, consumed as PACKED TARBALLS from the sibling repo ──────────────────────────────
  # 🔴 The 12 engine packages these apps use are not workspace members here — they live in
  # ../filter-enginez — so every manifest names them at their real version (kept in step by
  # `scripts/sync-engine-versions.mjs`) and this block points each at the tarball
  # `bash scripts/pack-engine-tarballs.sh` writes in the engine repo.
  #
  # 🔴 WHY TARBALLS AND NOT `link:../filter-enginez/packages/*`, which would be faster: a linked package
  # resolves its PEER dependencies — React, RxJS, Svelte, Vue, Angular — from the ENGINE repo's
  # node_modules, so the apps would get a second React. That is the duplicate-React failure described
  # in the react / react-dom note above: a component rendered by one React whose hooks resolve another
  # gets `null` from `useContext`/`useId`, and every app crashes at mount. A tarball installs INTO this
  # tree and resolves its peers here. It also exercises the real publish surface — `dist/`, the `files`
  # allow-list, `publishConfig.exports` — rather than raw source.
  #
  '@filter-enginez/angular-rxjs': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-angular-rxjs-0.0.6.tgz'
  '@filter-enginez/core': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-core-0.2.3.tgz'
  '@filter-enginez/eslint': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-eslint-0.0.4.tgz'
  '@filter-enginez/mock-data': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-mock-data-0.2.3.tgz'
  '@filter-enginez/react-signals': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-react-signals-0.0.7.tgz'
  '@filter-enginez/reactive-rxjs': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-reactive-rxjs-0.0.6.tgz'
  '@filter-enginez/reactive-signals': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-reactive-signals-0.0.6.tgz'
  '@filter-enginez/redux-bridge': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-redux-bridge-0.0.5.tgz'
  '@filter-enginez/svelte-signals': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-svelte-signals-0.0.6.tgz'
  '@filter-enginez/url-state-router': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-url-state-router-0.0.9.tgz'
  '@filter-enginez/vue-signals': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-vue-signals-0.0.6.tgz'
  '@filter-enginez/worker-bridge': 'file:../filter-enginez/tmp/engine-tarballs/filter-enginez-worker-bridge-0.0.5.tgz'

# ─── Accepted / false-positive advisories (kept out of `pnpm audit` noise) ─────────────────────────
# `auditConfig.ignoreGhsas` (pnpm 11+) suppresses the specific GHSA IDs below from `pnpm audit`. Each is
# individually justified; a NEW advisory on any of these packages still surfaces. See SECURITY.md →
# "Accepted advisories", which records the review date, and `scripts/recheck-accepted-advisories.mjs`,
# which re-checks each premise against the registry.
#
# 🟢 **pnpm audit reads RESOLVED versions, not declared ranges, so an override that fully patches the
# tree needs no ignore at all.** An ignore is for exactly two situations — no fix exists, or the
# vulnerable version survives in the tree on some path an override cannot reach. **An ignore that
# matches nothing is worse than useless**, for the same reason as a pin that matches nothing.
#
# ⚠ `postcss-selector-parser` resolves to BOTH a 6.x copy (through @tailwindcss/typography's exact pin) and
# 7.1.6. An ignore could not fix that copy, and an override can: the one above moves it to the patched 6.1.5,
# so pnpm audit has nothing to report and no ignore is needed.
#
#   - GHSA-vfj7-8cjw-p6xm (braces, high) — ACCEPTED BECAUSE THERE IS NO FIX. Stack-exhaustion DoS via
#     deeply-nested brace patterns. `braces@3.0.3` is the latest published version and `micromatch@4.0.8`
#     still declares `braces: ^3.0.3`, so the advisory's "Patched versions: None" is accurate — there is
#     nothing to upgrade to, and an override cannot invent a patched release. Every path is dev tooling
#     (`lint-staged`, `markdownlint-cli2`, `@tailwindcss/cli > @parcel/watcher`). The attack needs a
#     hostile glob PATTERN, and every glob in this repo comes from a committed config file rather than
#     from input. Re-review when braces publishes a fix or micromatch drops it.
#
#   - GHSA-238p-pmpm-9mq7 (katex, low) — ACCEPTED: the vulnerable code is never executed. Reached via
#     `markdownlint-cli2 > markdownlint > micromark-extension-math > katex`, and **`.markdownlint-cli2.yaml` enables no
#     math extension**, so KaTeX never renders anything. Patched only in `>=0.18.2` against a resolved `0.16.47` — in
#     0.x semver a minor bump is a breaking one, so an override would force a breaking change on a transitive dep to fix
#     a path that does not run. Re-review when markdownlint drops the math extension or a 0.16.x patch appears.
#
#   - GHSA-g3hv-75wg-m249 (minimatch, moderate) — ACCEPTED: NO IN-MAJOR FIX, the patched major breaks a caller, and no
#     caller reaches the vulnerable code. Patched only in `>=11.0.1` against a resolved `10.2.6`; every dependent
#     declares 10.x, and minimatch 11 changed what `Minimatch#set` holds, which `glob` 13 walks, so an override would
#     break glob. The amplification runs only at `optimizationLevel` 2 or higher. The lint dependents (eslint,
#     `@eslint/config-array`, `@typescript-eslint/typescript-estree`, `eslint-plugin-jsx-a11y-x`) use the default, 1.
#     `glob` sets 2, and it and `editorconfig` are reached only through `js-beautify`'s command-line tool;
#     `@vue/test-utils` loads js-beautify's library, which loads neither. Every pattern comes from a committed config
#     file. Re-review when eslint moves to minimatch 11, or another package starts depending on it.
#
#   - GHSA-3g3m-2fjr-6pw4 (glob, moderate) — ACCEPTED: NO IN-MAJOR FIX, and the vulnerable code is never executed.
#     Patched only in `>=14.0.2` against a resolved `13.0.6`, which `js-beautify` (latest) requires as `^13.0.6`. Its only
#     path is `@vue/test-utils > js-beautify`, whose library never loads glob; only its command-line tool does, and
#     nothing here runs it. The advisory is about an aborted walk that keeps reading, so it also needs an `AbortSignal`,
#     which that tool never passes. Re-review when js-beautify moves to glob 14, or another package starts depending
#     on glob.
#
#   - GHSA-gcqx-w48m-w2h4 (deepmerge, low) — ACCEPTED BECAUSE THERE IS NO FIX. `deepmerge@4.3.1` is the latest
#     published version and the advisory covers it. Its paths are build-time only: `@sveltejs/vite-plugin-svelte` and
#     `@sveltejs/adapter-node > @rollup/plugin-node-resolve` merge plugin options from committed config, never from
#     input. Re-review when deepmerge publishes a fix.
#
#   - GHSA-pfhg-q3qv-9q6r and GHSA-27mw-82g8-phjj (@sveltejs/kit, low) — ACCEPTED: the vulnerable features are never
#     used. Patched only in kit 3.0.0, a major, against `2.70.3`. The first is an open redirect through `use:enhance`
#     form actions, the second an XSS through a `cache-control` header passed to `setHeaders` on a prerendered page;
#     `examples-sveltekit` uses neither `use:enhance` nor `setHeaders`, and
#     `tests/tooling/acceptedAdvisoryParity.test.ts` keeps it that way. Re-review when the app moves to kit 3.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-238p-pmpm-9mq7
    - GHSA-g3hv-75wg-m249
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-gcqx-w48m-w2h4
    - GHSA-pfhg-q3qv-9q6r
    - GHSA-27mw-82g8-phjj
