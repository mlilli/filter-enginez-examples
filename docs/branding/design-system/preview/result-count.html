<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Result Count Tick</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--gray-0); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 14px 18px; background: var(--gray-1); border: 1px solid var(--gray-4); border-radius: var(--radius-lg); }
  .count { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 36px; font-weight: 500; color: var(--accent); letter-spacing: -0.02em; text-shadow: 0 0 20px var(--accent-haze); }
  .lbl { font-family: var(--font-sans); font-size: 14px; color: var(--gray-9); }
  .sub { font-family: var(--font-mono); font-size: 11px; color: var(--gray-7); margin-left: auto; }
  .delta { font-family: var(--font-mono); font-size: 12px; color: var(--success); }
</style></head>
<body>
<div class="meta">result counter · jetbrains mono · accent glow · ticks on filter change</div>
<div class="row">
  <div class="count">237</div>
  <div class="lbl">results</div>
  <div class="delta">−1,442</div>
  <div class="sub">filtered from 1,679 total</div>
</div>
</body></html>
