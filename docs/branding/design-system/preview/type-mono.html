<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type — Mono</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px 24px; background: var(--gray-0); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }
  .row { display: flex; gap: 18px; align-items: center; padding: 6px 0; }
  .lbl { font-family: var(--font-sans); font-size: 12px; color: var(--gray-7); width: 96px; }
  .mono { font-family: var(--font-mono); color: var(--gray-10); font-variant-numeric: tabular-nums; }
  .accent { color: var(--accent); }
  .price { color: var(--gray-11); font-weight: 500; }
</style></head>
<body>
<div class="meta">data · jetbrains mono · tabular numerals always on</div>
<div class="row"><div class="lbl">price</div><div class="mono price" style="font-size:18px">$1,247,500</div></div>
<div class="row"><div class="lbl">date</div><div class="mono" style="font-size:14px">2024-11-08T14:32:07Z</div></div>
<div class="row"><div class="lbl">probability</div><div class="mono accent" style="font-size:14px">P=0.78 · P=0.62 · P=0.41</div></div>
<div class="row"><div class="lbl">rule</div><div class="mono" style="font-size:12px; background:var(--gray-2); padding:4px 8px; border-radius:4px">InSetRule&lt;region&gt; { burgundy, loire }</div></div>
<div class="row"><div class="lbl">id</div><div class="mono" style="font-size:12px; color:var(--gray-7)">flt_01HQX9K3P2WMNRZ8Y4V</div></div>
</body></html>
