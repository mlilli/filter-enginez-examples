<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type — Sans Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px 24px; background: var(--gray-0); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--gray-4); }
  .row:last-child { border-bottom: 0; }
  .size { width: 56px; font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); }
  .specimen { font-family: var(--font-sans); color: var(--gray-10); }
</style></head>
<body>
<div class="meta">body · inter · 90% of typography</div>
<div class="row"><div class="size">12 / 500</div><div class="specimen" style="font-size:12px; font-weight:500">Caption — 237 results, filtered by Burgundy</div></div>
<div class="row"><div class="size">14 / 500</div><div class="specimen" style="font-size:14px; font-weight:500">Label — Sort by relevance</div></div>
<div class="row"><div class="size">16 / 450</div><div class="specimen" style="font-size:16px; font-weight:450">Body — selecting this filter would yield zero results.</div></div>
<div class="row"><div class="size">18 / 500</div><div class="specimen" style="font-size:18px; font-weight:500">Subhead — Active filters</div></div>
<div class="row"><div class="size">22 / 600</div><div class="specimen" style="font-size:22px; font-weight:600">Section — Wine cellar</div></div>
<div class="row"><div class="size">28 / 600</div><div class="specimen" style="font-size:28px; font-weight:600">Page — Suggested filters</div></div>
</body></html>
