<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Grayscale Ramp</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px 20px; background: var(--gray-0); }
  .ramp { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .swatch { aspect-ratio: 1 / 1.1; border-radius: var(--radius-md); position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px; border: 1px solid rgba(255,255,255,0.04); }
  .num { font-family: var(--font-mono); font-size: 10px; color: var(--gray-9); opacity: 0.85; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-mono); font-size: 9px; color: var(--gray-7); margin-top: 2px; }
  .swatch[data-step="9"] .num, .swatch[data-step="10"] .num, .swatch[data-step="11"] .num { color: var(--gray-0); }
  .swatch[data-step="9"] .hex, .swatch[data-step="10"] .hex, .swatch[data-step="11"] .hex { color: var(--gray-2); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
</style></head>
<body>
<div class="label">grayscale · warm/clay · 12 steps</div>
<div class="ramp">
  <div class="swatch" data-step="0" style="background:#0B0A09"><div class="num">00</div><div class="hex">0B0A09</div></div>
  <div class="swatch" data-step="1" style="background:#151412"><div class="num">01</div><div class="hex">151412</div></div>
  <div class="swatch" data-step="2" style="background:#1D1B19"><div class="num">02</div><div class="hex">1D1B19</div></div>
  <div class="swatch" data-step="3" style="background:#26241F"><div class="num">03</div><div class="hex">26241F</div></div>
  <div class="swatch" data-step="4" style="background:#312E29"><div class="num">04</div><div class="hex">312E29</div></div>
  <div class="swatch" data-step="5" style="background:#413E37"><div class="num">05</div><div class="hex">413E37</div></div>
  <div class="swatch" data-step="6" style="background:#56524A"><div class="num">06</div><div class="hex">56524A</div></div>
  <div class="swatch" data-step="7" style="background:#747066"><div class="num">07</div><div class="hex">747066</div></div>
  <div class="swatch" data-step="8" style="background:#969085"><div class="num">08</div><div class="hex">969085</div></div>
  <div class="swatch" data-step="9" style="background:#BCB6AA"><div class="num">09</div><div class="hex">BCB6AA</div></div>
  <div class="swatch" data-step="10" style="background:#DCD7CB"><div class="num">10</div><div class="hex">DCD7CB</div></div>
  <div class="swatch" data-step="11" style="background:#F1ECDF"><div class="num">11</div><div class="hex">F1ECDF</div></div>
</div>
</body></html>
