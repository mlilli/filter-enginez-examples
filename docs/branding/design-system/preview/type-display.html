<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--gray-0); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }
  .wordmark { font-family: var(--font-display); font-weight: 800; font-size: 42px; letter-spacing: 0.1em; color: var(--gray-11); line-height: 1; display: flex; align-items: center; gap: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent), 0 0 4px var(--accent-glow); }
  .hero { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: 0.08em; color: var(--gray-10); text-transform: uppercase; margin-top: 14px; }
  .note { font-family: var(--font-sans); font-size: 11px; color: var(--gray-7); margin-top: 12px; }
</style></head>
<body>
<div class="meta">display · orbitron · brand moments only</div>
<div class="wordmark"><div class="dot"></div>FILTER ENGINE</div>
<div class="hero">PROPAGATION · INTERSECTION · DESCENT</div>
<div class="note">Orbitron weight 700–800 · letter-spacing 0.08–0.1em · uppercase · reserved for wordmark + hero page titles + devtools-panel chrome.</div>
</body></html>
