<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Result Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px 22px; background: var(--gray-0); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { background: var(--gray-1); border: 1px solid var(--gray-4); border-radius: var(--radius-lg); overflow: hidden; transition: all 150ms var(--ease-out); }
  .card.hover { background: var(--gray-2); border-color: var(--gray-5); transform: translateY(-1px); }
  .photo { aspect-ratio: 16/9; background: linear-gradient(135deg, #312E29 0%, #1D1B19 100%); position: relative; display: flex; align-items: center; justify-content: center; }
  .photo svg { width: 36px; height: 36px; stroke: var(--gray-5); fill: none; stroke-width: 1.5; }
  .badge { position: absolute; top: 8px; left: 8px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: rgba(11,10,9,0.7); backdrop-filter: blur(8px); border: 1px solid var(--accent-dim); border-radius: 9999px; padding: 3px 8px; }
  .body { padding: 12px 14px; }
  .price { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 500; color: var(--gray-11); }
  .title { font-family: var(--font-sans); font-size: 13px; color: var(--gray-9); margin-top: 2px; }
  .attrs { display: flex; gap: 12px; margin-top: 8px; font-family: var(--font-sans); font-size: 11px; color: var(--gray-7); }
  .attrs span { display: flex; align-items: center; gap: 4px; }
  .attrs strong { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--gray-9); font-weight: 500; }
</style></head>
<body>
<div class="meta">result card · default · hover</div>
<div class="grid">
  <div class="card">
    <div class="photo">
      <span class="badge">NEW</span>
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div class="body">
      <div class="price">$1,247,500</div>
      <div class="title">1247 Mission St · SoMa</div>
      <div class="attrs">
        <span><strong>3</strong> bd</span>
        <span><strong>2</strong> ba</span>
        <span><strong>1,840</strong> sqft</span>
      </div>
    </div>
  </div>
  <div class="card hover">
    <div class="photo">
      <span class="badge">FEATURED</span>
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div class="body">
      <div class="price">$2,895,000</div>
      <div class="title">88 Pacific Ave · Pacific Heights</div>
      <div class="attrs">
        <span><strong>4</strong> bd</span>
        <span><strong>3.5</strong> ba</span>
        <span><strong>3,210</strong> sqft</span>
      </div>
    </div>
  </div>
</div>
</body></html>
