<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px 22px; background: var(--gray-0); display: flex; flex-direction: column; gap: 14px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); letter-spacing: 0.06em; text-transform: uppercase; }
  .row { display: flex; gap: 10px; align-items: center; }
  button { font-family: var(--font-sans); font-size: 14px; font-weight: 500; height: 36px; padding: 0 16px; border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 150ms var(--ease-out); }
  .primary { background: var(--accent); color: var(--gray-0); }
  .primary:hover { background: var(--accent-glow); box-shadow: 0 0 18px var(--accent-haze); }
  .secondary { background: var(--gray-2); color: var(--gray-10); border-color: var(--gray-5); }
  .secondary:hover { background: var(--gray-3); border-color: var(--gray-6); }
  .ghost { background: transparent; color: var(--gray-9); }
  .ghost:hover { background: var(--gray-2); color: var(--gray-10); }
  .danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .danger:hover { background: var(--danger-soft); }
  .disabled { background: var(--gray-3); color: var(--gray-6); border-color: var(--gray-4); cursor: not-allowed; }
  .focus { box-shadow: 0 0 0 2px var(--gray-0), 0 0 0 4px var(--accent-glow); }
  .icon { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .pill { border-radius: 9999px; }
  .sm { height: 28px; font-size: 12px; padding: 0 12px; }
</style></head>
<body>
<div class="meta">buttons · primary · secondary · ghost · danger</div>
<div class="row">
  <button class="primary">Apply filters</button>
  <button class="secondary">Clear all</button>
  <button class="ghost">Cancel</button>
  <button class="danger">Delete preset</button>
  <button class="disabled">Disabled</button>
</div>
<div class="row">
  <button class="primary focus">Focused</button>
  <button class="secondary"><svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Saved</button>
  <button class="ghost sm">Sort by</button>
  <button class="primary pill sm">+ Add filter</button>
</div>
</body></html>
