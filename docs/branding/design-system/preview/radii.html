<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px 24px; background: var(--gray-0); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 72px; height: 72px; background: var(--gray-2); border: 1px solid var(--gray-5); display: flex; align-items: center; justify-content: center; }
  .glow { box-shadow: 0 0 0 1px var(--accent-dim); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--gray-8); }
</style></head>
<body>
<div class="meta">radii · 2px → pill</div>
<div class="row">
  <div class="item"><div class="box" style="border-radius:2px"></div><div class="name">xs</div><div class="px">2</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">sm</div><div class="px">4</div></div>
  <div class="item"><div class="box glow" style="border-radius:6px"></div><div class="name">md</div><div class="px">6</div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">lg</div><div class="px">10</div></div>
  <div class="item"><div class="box" style="border-radius:14px"></div><div class="name">xl</div><div class="px">14</div></div>
  <div class="item"><div class="box" style="border-radius:20px"></div><div class="name">2xl</div><div class="px">20</div></div>
  <div class="item"><div class="box" style="width:96px; height:36px; border-radius:9999px; padding:0 14px; font-family:var(--font-sans); font-size:11px; color:var(--gray-10)">capsule</div><div class="name">full</div><div class="px">9999</div></div>
</div>
</body></html>
