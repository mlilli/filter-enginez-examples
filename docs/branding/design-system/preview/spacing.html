<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px 24px; background: var(--gray-0); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
  .lbl { width: 78px; font-family: var(--font-mono); font-size: 10px; color: var(--gray-7); }
  .px { width: 44px; font-family: var(--font-mono); font-size: 10px; color: var(--gray-9); text-align: right; }
  .bar { height: 10px; background: var(--accent); border-radius: 2px; box-shadow: 0 0 8px var(--accent-haze); }
</style></head>
<body>
<div class="meta">spacing · 4px base · linear scale</div>
<div class="row"><div class="lbl">space-1</div><div class="px">4px</div><div class="bar" style="width:4px"></div></div>
<div class="row"><div class="lbl">space-2</div><div class="px">8px</div><div class="bar" style="width:8px"></div></div>
<div class="row"><div class="lbl">space-3</div><div class="px">12px</div><div class="bar" style="width:12px"></div></div>
<div class="row"><div class="lbl">space-4</div><div class="px">16px</div><div class="bar" style="width:16px"></div></div>
<div class="row"><div class="lbl">space-5</div><div class="px">20px</div><div class="bar" style="width:20px"></div></div>
<div class="row"><div class="lbl">space-6</div><div class="px">24px</div><div class="bar" style="width:24px"></div></div>
<div class="row"><div class="lbl">space-8</div><div class="px">32px</div><div class="bar" style="width:32px"></div></div>
<div class="row"><div class="lbl">space-12</div><div class="px">48px</div><div class="bar" style="width:48px"></div></div>
<div class="row"><div class="lbl">space-16</div><div class="px">64px</div><div class="bar" style="width:64px"></div></div>
</body></html>
