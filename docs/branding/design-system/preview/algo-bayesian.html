<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Bayesian Co-occurrence Hero</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 12px 16px; background: var(--gray-0); }
  .meta { font-family: var(--font-mono); font-size: 9px; color: var(--gray-7); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  .stage { background: radial-gradient(ellipse at center, #151412, #0B0A09); border: 1px solid var(--gray-4); border-radius: var(--radius-lg); padding: 6px; position: relative; }
  .ttl { position: absolute; top: 10px; left: 14px; font-family: var(--font-display); font-size: 10px; color: var(--gray-9); letter-spacing: 0.16em; text-transform: uppercase; z-index:2; }
  svg { display: block; width: 100%; height: 200px; }
  .edge { stroke: #312E29; fill: none; }
  .edge.strong { stroke: #56524A; }
  .pulse { fill: #67E8F9; filter: drop-shadow(0 0 4px #22D3EE); opacity: 0; }
  .node { fill: #56524A; }
  .node.source { fill: #22D3EE; filter: drop-shadow(0 0 8px #22D3EE); }
  .node.high { fill: #22D3EE; filter: drop-shadow(0 0 6px #22D3EE); }
  .node.mid { fill: #67E8F9; filter: drop-shadow(0 0 3px #22D3EE); opacity: 0.85; }
  .node.low { fill: #969085; }
  .node-lbl { font-family: var(--font-sans); font-size: 9px; fill: var(--gray-9); text-anchor: middle; }
  .prob { font-family: var(--font-mono); font-size: 8px; fill: var(--accent); text-anchor: middle; }

  .p1 { animation: t1 3s linear infinite; }
  .p2 { animation: t2 3s linear infinite 0.5s; }
  .p3 { animation: t3 3s linear infinite 1s; }
  @keyframes t1 { 0% { transform: translate(220px, 100px); opacity: 0; } 15%{opacity:1} 100% { transform: translate(380px, 60px); opacity: 0; } }
  @keyframes t2 { 0% { transform: translate(220px, 100px); opacity: 0; } 15%{opacity:1} 100% { transform: translate(400px, 130px); opacity: 0; } }
  @keyframes t3 { 0% { transform: translate(220px, 100px); opacity: 0; } 15%{opacity:1} 100% { transform: translate(150px, 50px); opacity: 0; } }

  .ring { stroke: #22D3EE; stroke-width: 1; fill: none; stroke-dasharray: 3 3; opacity: 0; animation: ringFade 3s ease-in-out infinite 1.5s; }
  @keyframes ringFade { 0%,100% { opacity: 0; } 50% { opacity: 0.7; } }
</style></head>
<body>
<div class="meta">algorithm hero · bayesian co-occurrence · probability propagates along edge weights</div>
<div class="stage">
  <div class="ttl">BAYESIAN · CO-OCCURRENCE</div>
  <svg viewBox="0 0 660 200">
    <!-- edges -->
    <line class="edge strong" x1="220" y1="100" x2="380" y2="60" stroke-width="2.5"/>
    <line class="edge strong" x1="220" y1="100" x2="400" y2="130" stroke-width="2"/>
    <line class="edge" x1="220" y1="100" x2="150" y2="50" stroke-width="1.5"/>
    <line class="edge" x1="220" y1="100" x2="120" y2="150" stroke-width="0.8"/>
    <line class="edge" x1="220" y1="100" x2="490" y2="160" stroke-width="0.8"/>
    <line class="edge" x1="380" y1="60" x2="510" y2="50" stroke-width="1.5"/>
    <line class="edge" x1="400" y1="130" x2="560" y2="110" stroke-width="0.8"/>
    <line class="edge" x1="150" y1="50" x2="80" y2="100" stroke-width="0.8"/>

    <!-- source node -->
    <circle class="ring" cx="380" cy="60" r="14"/>
    <circle class="ring" cx="400" cy="130" r="14"/>

    <circle class="node source" cx="220" cy="100" r="9"/>
    <text class="node-lbl" x="220" y="125">Burgundy</text>

    <circle class="node high" cx="380" cy="60" r="8"/>
    <text class="node-lbl" x="380" y="44">Pinot Noir</text>
    <text class="prob" x="380" y="86">0.78</text>

    <circle class="node high" cx="400" cy="130" r="7"/>
    <text class="node-lbl" x="400" y="155">Vintage 2015</text>
    <text class="prob" x="400" y="116">0.62</text>

    <circle class="node mid" cx="150" cy="50" r="6"/>
    <text class="node-lbl" x="150" y="34">Chardonnay</text>
    <text class="prob" x="150" y="76">0.41</text>

    <circle class="node low" cx="120" cy="150" r="5"/>
    <text class="node-lbl" x="120" y="170">Loire</text>
    <text class="prob" x="120" y="138" style="fill: var(--gray-8)">0.18</text>

    <circle class="node low" cx="490" cy="160" r="5"/>
    <text class="node-lbl" x="490" y="180">Body: Full</text>

    <circle class="node low" cx="510" cy="50" r="5"/>
    <text class="node-lbl" x="510" y="34">Rosé</text>

    <circle class="node low" cx="560" cy="110" r="5"/>
    <text class="node-lbl" x="560" y="100">Champagne</text>

    <circle class="node low" cx="80" cy="100" r="5"/>
    <text class="node-lbl" x="80" y="116">Sauv. Blanc</text>

    <!-- traveling pulses -->
    <circle class="pulse p1" cx="0" cy="0" r="2.5"/>
    <circle class="pulse p2" cx="0" cy="0" r="2.5"/>
    <circle class="pulse p3" cx="0" cy="0" r="2"/>
  </svg>
</div>
</body></html>
