# ─────────────────────────────────────────────────────────────────────────────
# Continuous Integration — the gates for the six example apps and their shared
# packages: typecheck, lint (ESLint + markdown), formatting, spelling, unit tests
# with coverage, the framework component tests, a full production build, and the
# brand bundle-size budgets — and, on `main`, the deployment of every site.
#
# 🔴 THE ENGINE IS CHECKED OUT BESIDE THIS REPO, because the apps consume it as PACKED
# TARBALLS from ../filter-enginez (see pnpm-workspace.yaml's override block). So the job
# clones both, packs the engine, and only then installs here.
#
# 🔴 THE ENGINE CHECKOUT IS PINNED to the commit in `.github/engine-ref`. `--frozen-lockfile`
# verifies each engine tarball's integrity hash, and those hashes change with every engine
# commit — so checking out the engine's moving `main` would fail this install on the next
# engine change, for reasons that have nothing to do with this repo. Re-packing the same
# commit is byte-identical, so a pinned ref keeps the lockfile valid. To move it, run
# `bash scripts/pin-engine-ref.sh` (it refuses a dirty engine tree), then pack and install so
# the lockfile and the pin change together. `tests/tooling/engineRefPinned.test.ts` checks the
# file's shape; the first step below refuses a placeholder.
#
# ⚠ NO E2E JOB. `pnpm test:e2e` runs locally: it starts every app's dev server and drives a real
# browser. Where the real wine corpus is linked (CC BY-NC-SA 4.0 data that never leaves a
# developer's machine; see NOTICE.md) the wine suites run against it, otherwise against the
# 150,000 synthetic wines.
#
# 🟢 DEPLOYMENT. On a push to `main`, once `gates` is green, the `deploy` job ships every package
# that has a `wrangler.jsonc` to Cloudflare Workers — one matrix entry per site, listed by
# `scripts/list-deploy-targets.mjs`, so the matrix cannot drift from the configs. Each entry builds
# its package for production, refuses to continue if the local-only wine corpus is anywhere in the
# output, writes and checks the corpus files a site with examples-server's `/api` Worker serves as
# static assets, adds the bundled fonts' licenses, and runs `wrangler deploy` with the repository
# secrets `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`. `fail-fast: false`: one site failing does
# not stop the others, and the run still ends red. Pull requests never deploy.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref at a time. A pull request cancels its superseded run (rapid pushes to a PR). A run
# on `main` is never cancelled, because it deploys, and a deploy stopped halfway would leave some
# sites on the previous commit: instead the next `main` run waits, and a newer push replaces any run
# still waiting. So deploys never interleave, and never land out of order.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The commit hooks (.husky/) are for people. `pnpm install` would install them here
# too, and the release job's own `git push` of version tags would then run the
# pre-push hook — the whole coverage suite, once per push, in parallel.
env:
  HUSKY: "0"

jobs:
  gates:
    name: Gates (typecheck · lint · spell · test · build)
    runs-on: ubuntu-latest
    outputs:
      deploy-targets: ${{ steps.deploy-targets.outputs.targets }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: filter-enginez-examples

      - name: Read the pinned engine commit
        id: engine
        working-directory: filter-enginez-examples
        run: |
          ref="$(tr -d '[:space:]' < .github/engine-ref)"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error file=.github/engine-ref::expected a 40-character engine commit SHA, found '$ref'. Run scripts/pin-engine-ref.sh."
            exit 1
          fi
          echo "sha=$ref" >> "$GITHUB_OUTPUT"

      # A public repo, so no token. Its path must be the sibling the override block names.
      - name: Checkout the engine beside it (pinned)
        uses: actions/checkout@v7
        with:
          repository: mlilli/filter-enginez
          ref: ${{ steps.engine.outputs.sha }}
          path: filter-enginez

      - name: Enable Corepack (pins pnpm from package.json packageManager)
        run: corepack enable

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: filter-enginez-examples/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            filter-enginez/pnpm-lock.yaml
            filter-enginez-examples/pnpm-lock.yaml

      # The deploy job's matrix (one entry per `wrangler.jsonc`). Listed on every run, pull requests
      # included, so a config that does not parse fails here rather than in the deploy after the merge.
      - name: List the deploy targets
        id: deploy-targets
        working-directory: filter-enginez-examples
        run: node scripts/list-deploy-targets.mjs --github-output

      - name: Install the engine (frozen lockfile)
        working-directory: filter-enginez
        run: pnpm install --frozen-lockfile

      # Builds the 13 packages and packs them into filter-enginez/tmp/engine-tarballs,
      # which is exactly where this repo's overrides look.
      - name: Pack the engine tarballs
        working-directory: filter-enginez
        run: bash scripts/pack-engine-tarballs.sh

      - name: Install (frozen lockfile)
        working-directory: filter-enginez-examples
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: filter-enginez-examples
        run: pnpm typecheck

      - name: Lint (ESLint)
        working-directory: filter-enginez-examples
        run: pnpm lint

      - name: Lint (Markdown)
        working-directory: filter-enginez-examples
        run: pnpm lint:markdown

      # The whole-tree check. lint-staged runs `prettier --write` on STAGED files only, so a file
      # changed by a rebase, a merge, or `git commit --no-verify` is seen only here. `.prettierignore`
      # excludes the local `.pnpm-store`, generated `.svelte-kit` output, transient run artifacts and
      # `pnpm-workspace.yaml`, so the run reports only files somebody can act on.
      - name: Formatting (Prettier)
        working-directory: filter-enginez-examples
        run: pnpm prettier:check

      - name: Spelling (cspell, en-US)
        working-directory: filter-enginez-examples
        run: pnpm cspell

      - name: Unit tests + coverage (100% policy)
        working-directory: filter-enginez-examples
        run: pnpm test:coverage

      # Vue, SvelteKit and Angular run their component tests under their own framework-aware runners
      # (each package's Vitest config, and `ng test`), so the root Vitest projects above do not
      # include them. This runs all three.
      - name: Framework component tests (Vue, SvelteKit, Angular)
        working-directory: filter-enginez-examples
        run: pnpm test:frameworks

      # Each demo app's build also measures the JavaScript its first screen loads and fails over the
      # budget in its `build` script (`scripts/check-startup-budget.mjs`), so a page that slips back into
      # the startup bundle fails here rather than shipping; and it checks the first page's font preloads
      # (`scripts/check-font-preloads.mjs`).
      - name: Build all packages
        working-directory: filter-enginez-examples
        run: pnpm build

      # MUST follow the build: size-limit measures `dist/`, not `src/`. Four budgets, all for
      # `brand` — the mark, the wordmark and the three loaders — gzipped and MARGINAL, with React
      # `ignore`d so the figure is the brand code rather than the framework. The engine packages'
      # budgets live in the engine repository.
      - name: Bundle-size budgets (size-limit)
        working-directory: filter-enginez-examples
        run: pnpm size

  deploy:
    name: Deploy ${{ matrix.target.hosts }}
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      # Every site deploys independently: one failing does not cancel the rest, and the run still ends
      # red, with the failed site named in its job title.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.gates.outputs.deploy-targets) }}
    # Belt and braces with the workflow-level group: never two deploys of one Worker at once.
    concurrency:
      group: deploy-${{ matrix.target.package }}
      cancel-in-progress: false
    env:
      # Selects adapter-cloudflare in examples-sveltekit/svelte.config.js; every other package ignores it.
      SVELTEKIT_ADAPTER: cloudflare
      # Passed through `env` rather than interpolated into the scripts below.
      TARGET_PACKAGE: ${{ matrix.target.package }}
      TARGET_CONFIG: ${{ matrix.target.config }}
      TARGET_ASSETS: ${{ matrix.target.assets }}
      TARGET_API_CORPUS: ${{ matrix.target.apiCorpus }}
    steps:
      # The same workspace as `gates`: this repo, the engine beside it at the pinned commit, packed.
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: filter-enginez-examples

      - name: Read the pinned engine commit
        id: engine
        working-directory: filter-enginez-examples
        run: |
          ref="$(tr -d '[:space:]' < .github/engine-ref)"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error file=.github/engine-ref::expected a 40-character engine commit SHA, found '$ref'. Run scripts/pin-engine-ref.sh."
            exit 1
          fi
          echo "sha=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout the engine beside it (pinned)
        uses: actions/checkout@v7
        with:
          repository: mlilli/filter-enginez
          ref: ${{ steps.engine.outputs.sha }}
          path: filter-enginez

      - name: Enable Corepack (pins pnpm from package.json packageManager)
        run: corepack enable

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: filter-enginez-examples/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            filter-enginez/pnpm-lock.yaml
            filter-enginez-examples/pnpm-lock.yaml

      - name: Install the engine (frozen lockfile)
        working-directory: filter-enginez
        run: pnpm install --frozen-lockfile

      - name: Pack the engine tarballs
        working-directory: filter-enginez
        run: bash scripts/pack-engine-tarballs.sh

      - name: Install (frozen lockfile)
        working-directory: filter-enginez-examples
        run: pnpm install --frozen-lockfile

      # turbo builds the package's workspace dependencies first (`^build`). Every app's `build` script
      # ends by stripping the local-only wine corpus (tests/tooling/buildsStripLocalCorpus.test.ts).
      - name: Build for production
        working-directory: filter-enginez-examples
        run: pnpm turbo run build --filter="$TARGET_PACKAGE"

      # The corpus is CC BY-NC-SA 4.0 and never ships. CI has no copy to leak, so this is the last line
      # of defense rather than the first: it fails the deploy if any such file reached the upload.
      - name: Refuse to deploy the local-only wine corpus
        working-directory: filter-enginez-examples
        run: |
          if [ ! -d "$TARGET_ASSETS" ]; then
            echo "::error file=$TARGET_CONFIG::assets.directory '$TARGET_ASSETS' does not exist after the build."
            exit 1
          fi
          found="$(find "$TARGET_ASSETS" \( -name 'data-real-*' -o -name 'winemag-data*' \) -print)"
          if [ -n "$found" ]; then
            echo "::error::the local-only wine corpus is in the deploy output:"
            echo "$found"
            exit 1
          fi

      # The sites whose `/api` is examples-server's Worker serve each dataset's corpus as a static file,
      # `/api/corpus/<dataset>.json`: their `wrangler.jsonc` excludes `/api/corpus/*` from
      # `run_worker_first`. The account is on the Workers Free plan, 10 ms of CPU per request, and
      # serializing a corpus takes several times that, so the Worker must never answer it. `corpus:write`
      # writes the exact bytes the route sends; `corpus:check` then fails the deploy if any registered
      # dataset's file is missing or differs — the assets would answer a missing one with the
      # single-page-application fallback, `index.html` and a 200. `apiCorpus` is empty for every other
      # site (scripts/list-deploy-targets.mjs).
      - name: Write the API corpus files into the static assets
        working-directory: filter-enginez-examples
        run: |
          if [ -z "$TARGET_API_CORPUS" ]; then
            echo "No examples-server API Worker on this site: no corpus files to write."
            exit 0
          fi
          pnpm --filter @filter-enginez/examples-server corpus:write "$PWD/$TARGET_API_CORPUS"
          pnpm --filter @filter-enginez/examples-server corpus:check "$PWD/$TARGET_API_CORPUS"

      # Every site serves the brand's bundled fonts, and the SIL Open Font License requires its text to
      # travel with them (NOTICE.md). Each font's own OFL.txt, from the directory the font comes from.
      - name: Ship the font licenses with the fonts
        working-directory: filter-enginez-examples
        run: |
          for license in packages/brand/src/fonts/*/OFL.txt; do
            font="$(basename "$(dirname "$license")")"
            mkdir -p "$TARGET_ASSETS/licenses/fonts/$font"
            cp "$license" "$TARGET_ASSETS/licenses/fonts/$font/OFL.txt"
          done

      - name: Deploy to Cloudflare Workers
        working-directory: filter-enginez-examples
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        # The Wrangler pinned in pnpm-lock.yaml (a root devDependency, and the peer adapter-cloudflare
        # builds with), so the deploy uses the same version that was tested.
        run: pnpm exec wrangler deploy --config "$TARGET_CONFIG"
