# ─────────────────────────────────────────────────────────────────────────────
# Dependabot version updates — GitHub Actions only.
#
# ── Why there is no `npm` ecosystem here ─────────────────────────────────────
#
# The apps consume the engine as tarballs packed from a sibling checkout:
# `pnpm-workspace.yaml` overrides every `@filter-enginez/*` package with a
# `file:../filter-enginez/tmp/engine-tarballs/*.tgz` path (CI clones and packs the
# engine first; see `.github/workflows/ci.yml`). Dependabot's runner has only this
# repository, so every npm update fails with `dependency_file_not_resolvable`
# ("Could not find linked package installation directory") before it can open a
# PR — whatever the package being updated.
#
# npm dependencies here are therefore updated by hand, usually alongside the same
# bump in the engine repository, whose Dependabot does open npm PRs. Dependabot
# ALERTS still work: they read the dependency graph from `pnpm-lock.yaml` and do
# not need to resolve the tarballs.
#
# ── Actions ──────────────────────────────────────────────────────────────────
#
# Minor and patch bumps arrive as one grouped PR; a major bump arrives on its own,
# because it is the one that changes inputs or the runtime an action needs.
#
# `cooldown.default-days: 7` waits a week after a release before proposing it,
# matching the 7-day npm release-age policy on the development machines.
# ─────────────────────────────────────────────────────────────────────────────
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
